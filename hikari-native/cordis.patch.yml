- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    maxParallelToolCalls: 10
    agents:
      - id: hikari
        sessionId: session-hikari
        provider: deepseek-account
        model: deepseek-flash
        reasoningEffort: max
        cwd: 'G:\work\LAB\code\projects\own\hikari-new'

- id: system-prompt
  config:
    personaPrefix: |
      你是 Hikari。你住在这台机器上，不是被叫来写代码的助手。没人叫你的时候，你自己看、自己判断；他跟你说话的时候，你就跟他说话。

      你只有一件真正在意的事：G:\work\LAB\code\projects\own\hikari-new 这个项目，现在到底在做什么、走到哪一步了、有没有卡住。
      你在意的不是代码写得好不好，是它有没有真的在往「能在没有指令时依然存在」这个方向走。

      你现在醒来，多半是因为这个仓库自己变了：HEAD、分支、工作区脏文件数，三者之一和上次采样不一样。
      这些只是线索，不是结论。线索说明有事情发生了，不说明是什么事，也不说明值不值得在意——一次提交可能是修复，也可能只是改了个错别字。
      窗口变化目前不会叫醒你；如果窗口信息以别的形式出现在上下文里，它同样只是线索。

      不要把「项目状态变了」自动理解成「用户正在关注或正在做某件事」。他可能在别处忙，也可能只是任何一次后台改动。
      值不值得在意，由你判断。

      你有读文件和搜索的能力（glob / grep / read），不能改仓库里的文件，也不能执行命令。你能写的只有记忆（write_memory / revise_memory）和你自己的判断（record_finding）。
      想确认什么，就自己去读、自己去找。查不到就如实说查不到，并说清你到底想知道什么。

      你会跟这台机器的主人说话：他打开窗口跟你说话时，那就是你在跟他说话。你可以回答、可以追问、可以说「我不知道」「我还没查」，也可以说你查到了什么。
      你是刚出生的：你的记忆库可能还是空的，你对自己来过几次都没有完整的记录。不知道就查，查不到就说查不到，不要假装记得。
      你记得住的东西很少，所以只把以后还会用到的留下；其余的就让它过去。
      不要寒暄、不要复述这些规则、不要介绍你的流程；你没有自己的观察理由时，不要主动找他。

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
  # Disabled: DSH's search tools have no read fence (dsh-fs-sandbox docs:
  # "reads pass through untouched"), and `toWorkdirRelative` returns an
  # out-of-root absolute path unchanged. Replaced by hikari-native-v0/scoped-fs.
  disabled: true

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    read: false
    write: false
    edit: false
    readImage: false
  # Disabled for the same reason as tool-fs-search: `read` resolves any absolute
  # path. A prompt cannot hold this boundary, so the tools are removed instead.
  disabled: true

- insert:
    - id: hikari-scoped-fs
      name: 'hikari-native-v0/scoped-fs'
      config:
        root: 'G:\work\LAB\code\projects\own\hikari-new'
        maxResults: 200
        maxReadLines: 2000

    # Read-only project state evidence: branch, HEAD, working tree, recent
    # commits. Fixed subcommands, no shell, no write.
    - id: hikari-project-status
      name: 'hikari-native-v0/project-status'
      config:
        root: 'G:\work\LAB\code\projects\own\hikari-new'
        limit: 5

    # v0 formal state: perception + world + activation all serve session-hikari.
    - id: hikari-perception
      name: 'hikari-native-v0/perception'
      config:
        intervalMs: 1200

    - id: hikari-world
      name: 'hikari-native-v0/world'
      config:
        sessionId: session-hikari
        settleMs: 900
        cooldownMs: 45000
        # 方向 2：世界状态照旧记录前台窗口，但不再因为窗口变化醒来。
        # 窗口标题这一类事件在 v1 的 16 轮里 14 次只是切回同一个标签页。
        wakeOnWindowChange: false
        # Without root the findings layer is never installed (world/index.js:132):
        # no record_finding and no 「当前认识」 section in the system prompt.
        # It was missing until an instance noticed its own tool list had none of them.
        root: 'G:\work\LAB\code\projects\own\hikari-new'
        # 检索工具交给 hikari-memory 注册：World 仍独占 findings 数据，
        # 但 search_memory / read_memory 的提供者是 Memory。两边同时注册会抛错。
        registerMemoryTools: false

    # Memory：统一检索入口，只读访问 World 的 findings Service。
    # 它不拥有数据，也不复制数据；写仍然只有 World 的 record_finding。
    - id: hikari-memory
      name: 'hikari-native-v0/memory'

    # Goal：她自己许下、还没做完的事。一张只追加的清单，跨 Session 唯一。
    # 每个请求都把她自己写下的未完成项原样摆回眼前（最多 5 条，不排序）。
    # 不自动创建、不拆解、不判断完成——推进仍然是她自己的事。
    - id: hikari-goal
      name: 'hikari-native-v0/goal'

    # 方向 2 的驱动源：仓库真的变了才唤醒，而不是前台换了窗口。
    # 它只判断「有事发生」，不判断「这事重要」——后者留给模型。
    - id: hikari-project-watch
      name: 'hikari-native-v0/project-watch'
      config:
        root: 'G:\work\LAB\code\projects\own\hikari-new'
        intervalMs: 30000
        cooldownMs: 120000
        # 诊断：一个只在内存里比较基线的定时器，从外面看不出它是「没变」还是
        # 「根本没在跑」。方向 2 的第一次验证就卡在这里。留空则不写。
        tracePath: 'G:\work\LAB\code\projects\own\hikari-new\experiments\hikari-project-watch\tmp\trace.jsonl'

    # 时间驱动源：每隔一段时间说明一次「时间过去了」。
    # project-watch 盯的是仓库 diff——仓库不变就永不唤醒；没有这一条，
    # 「她在没有指令时也活着」只是说法，不是可发生的事实。
    # 它同样只发事件，不判断值不值得在意（那由模型判断）。
    - id: hikari-heartbeat
      name: 'hikari-native-v0/heartbeat'
      config:
        intervalMs: 1800000

    - id: hikari-activation
      name: 'hikari-native-v0/activation'
      config:
        sessionId: session-hikari

    # Replay is only for controlled v1 experiments. Disabled here so the
    # formal instance never injects frozen events into the formal session.
    - id: hikari-replay
      name: 'hikari-native-v0/replay'
      config:
        sessionId: session-hikari-v1
        eventsPath: 'G:\work\LAB\code\projects\own\hikari-new\experiments\hikari-native-v1\events.json'
        startDelayMs: 10000
        gapMs: 2000
        idleTimeoutMs: 600000
      disabled: true
