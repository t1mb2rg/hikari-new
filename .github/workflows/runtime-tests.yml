name: Runtime Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build and test
        run: npm test

      # The surface's C# is split so that only the window needs Windows: `HumanSurface.Core` and its
      # tests target the neutral framework and touch neither a window nor a registry key, so they run
      # here. The cases that genuinely need Windows say so and skip themselves with a reason, and the
      # conformance cases reach the built `dist/` from the step above — which is why this runs after
      # the npm build rather than beside it.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Surface core tests
        run: dotnet run --project apps/human-surface/HumanSurface.Tests/HumanSurface.Tests.csproj

  # The WinForms shell cannot be built anywhere but Windows, and a build that only ever happened on the
  # author's machine is not a build that is known to work. This job is what makes "the surface compiles"
  # a claim CI checks rather than a claim the repository asserts, and it is also where the Windows-only
  # cases — kernel32, named pipes, the real TypeScript decoder — stop skipping and actually run.
  surface:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # The build and the tests both, and not the build alone any more. This step used to run `npm run
      # build` on the argument that the TypeScript suite had already run in the job above and repeating
      # it would spend billable Windows minutes on tests that do not need them. That argument holds for
      # the tests that run on both hosts. It does not hold for the ones that only run here, and there
      # was no step anywhere that ran those: the desktop content reader's tests create a real WPF
      # window, walk it over UI Automation and answer through a real named pipe, and on the Ubuntu job
      # every one of them skip themselves with a reason. So the Windows-only half of the suite was an
      # assertion about this platform rather than a check, in a job whose whole purpose is the opposite
      # of that — the same defect the comment above this job already describes for the shell.
      #
      # `npm test` is `npm run build && node --test test/*.test.mjs`, so `dist/` is still produced for
      # the .NET steps below and a build failure still fails this job; nothing here relies on the build
      # step being separate. A failing test fails the job — there is no `continue-on-error` and no
      # widening of what counts as a skip.
      - name: Test the runtime
        run: npm test

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the shell
        run: dotnet build apps/human-surface/HumanSurface/HumanSurface.csproj

      - name: Surface tests
        run: dotnet run --project apps/human-surface/HumanSurface.Tests/HumanSurface.Tests.csproj
